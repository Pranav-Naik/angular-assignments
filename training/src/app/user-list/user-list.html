<table class="table">
  <thead>
    <tr>
      <th scope="col">Email</th>
      <th scope="col">First</th>
      <th scope="col">Last</th>
      <th scope="col">Password</th>
      @if(newSharedData.mobileNumber) {
        <th scope="col">Mobile</th>
      }
      <th scope="col">Is Checked</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <th scope="row">{{newSharedData.email}}</th>
      <td>{{newSharedData.firstName}}</td>
      <td>{{newSharedData.lastName}}</td>
      <td>{{newSharedData.password}}</td>
      @if(newSharedData.mobileNumber) {
        <td>{{newSharedData.mobileNumber}}</td>
      }
      <td>{{newSharedData.isChecked}}</td>
    </tr>
  </tbody>
</table>
